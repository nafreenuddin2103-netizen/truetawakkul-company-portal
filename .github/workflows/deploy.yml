name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  docker-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production (Cloud Run)
    needs: docker-publish
    runs-on: ubuntu-latest

    steps:
      - name: Deployment Simulation
        run: |
          echo "🚀 Initiating zero-downtime deployment to Production..."
          echo "📦 Image: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          echo "✅ Production deployment successful!"
          
      - name: Smoke Test Simulation
        run: |
          echo "🔍 Running basic smoke test against production endpoint..."
          echo "✅ Smoke test passed."
