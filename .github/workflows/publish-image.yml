name: Publish Company Backend Image

# INFRA-015E: builds the existing Dockerfile and publishes an immutably
# tagged image to the truetawakkul-prod Artifact Registry repository.
# Does not deploy to Cloud Run — that is a separate, later step.

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  PROJECT_ID: project-a38a00da-9f27-440e-ba4
  REGION: asia-south1
  REPOSITORY: truetawakkul-prod
  IMAGE: company-backend
  WORKLOAD_IDENTITY_PROVIDER: projects/1075997216838/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  SERVICE_ACCOUNT: github-actions-ci-sa@project-a38a00da-9f27-440e-ba4.iam.gserviceaccount.com

jobs:
  build-and-push:
    name: Build & Push to Artifact Registry
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve immutable image reference
        id: image-ref
        run: |
          echo "image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Tagged by commit SHA only. truetawakkul-prod has immutable_tags
      # enabled (see modules/artifact-registry), so a mutable tag like
      # "latest" could only ever be pushed once and would then break every
      # subsequent build.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image-ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image exists in Artifact Registry
        run: |
          gcloud artifacts docker images describe "${{ steps.image-ref.outputs.image }}" \
            --format="value(image_summary.digest)"
